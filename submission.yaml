submission:
  title: "ThreatFusion — Evidence-Backed Threat Intelligence Correlation"
  problem_statement: >
    Defence analysts receive heterogeneous SIEM, cyber-sensor and intelligence observations
    that are difficult to correlate without over-grouping routine activity. ThreatFusion
    validates candidate incident hypotheses against behavioral evidence, ATT&CK context and
    attack-flow coherence before prioritizing them for investigation and command briefing.
  solution_summary: >
    ThreatFusion normalizes four source schemas, performs weighted temporal/entity correlation,
    infers ATT&CK sub-techniques, measures attack-flow coherence, and separates evidence confidence,
    threat severity, mission impact and urgency. IBM Bob accesses grounded investigation tools through
    MCP and generates commander-ready BLUFs without calculating or inventing the underlying evidence.
  key_features:
    - "Evidence-weighted multi-source candidate correlation with temporal decay and source independence"
    - "Auditable MITRE ATT&CK technique/sub-technique inference with provenance"
    - "Attack-flow coherence plus negative evidence and telemetry uncertainty"
    - "Explainable confidence, threat severity, mission impact and urgency scoring"
    - "IBM Bob MCP investigation workflow with /investigate, /explain, /bluf and /runbook"
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "Uvicorn"]
    ibm_technologies: ["IBM Bob", "IBM Bob MCP workflow"]
    databases: ["Versioned JSON reference/data"]
    other: ["MITRE ATT&CK v19.2", "pytest", "JSON-RPC 2.0 over stdio"]
  what_we_are_most_proud_of: >
    We do not promote a shared-entity cluster directly into an incident. The engine separates
    candidate hypotheses from incident promotion and requires ATT&CK evidence, coherent behavior,
    corroboration and contextual impact. Runtime scoring never reads the benchmark ground truth.
  known_limitations: >
    The prototype uses synthetic telemetry and a bundled ATT&CK reference snapshot. It is an
    evidence-backed hackathon prototype with production-oriented architecture, not a production SOC,
    and does not perform autonomous containment or real actor attribution. Hosted video link is
    pending external upload prior to final submission.

